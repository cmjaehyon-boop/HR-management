<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외 감리 인력 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #F0F4F8; color: #1A1D23; font-size: 13px; }
  .header { background: #0F172A; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-title { color: #F1F5F9; font-size: 15px; font-weight: 700; }
  .header-sub { color: #64748B; font-size: 10px; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .nav { display: flex; gap: 6px; }
  .nav-btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; background: transparent; color: #94A3B8; transition: all 0.15s; }
  .nav-btn.active { background: #3B82F6; color: #fff; }
  .sync-btn { padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; background: #1E293B; color: #94A3B8; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
  .sync-btn:hover { background: #334155; color: #F1F5F9; }
  .sync-btn.loading { opacity: 0.6; pointer-events: none; }
  .tab { display: none; padding: 18px 20px; }
  .tab.active { display: block; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #E2E8F0; padding: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: #fff; border-radius: 10px; border: 1px solid #E2E8F0; padding: 12px 16px; }
  .stat-label { font-size: 11px; color: #6B7280; margin-bottom: 3px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-row input { flex: 1; min-width: 160px; padding: 8px 12px; border-radius: 7px; border: 1px solid #E2E8F0; font-size: 13px; outline: none; background: #fff; }
  .filter-btn { padding: 7px 12px; border-radius: 7px; border: 1px solid #E2E8F0; cursor: pointer; font-size: 12px; font-weight: 600; background: #fff; color: #374151; }
  .filter-btn.active { background: #0F172A; color: #fff; border-color: #0F172A; }
  .tbl-wrap { background: #fff; border-radius: 10px; border: 1px solid #E2E8F0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #6B7280; background: #F8FAFC; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #F8FAFC; }
  .badge { display: inline-block; border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .badge-active { background: #DBEAFE; color: #2563EB; }
  .badge-wait { background: #DCFCE7; color: #16A34A; }
  .badge-dispatch { background: #F3E8FF; color: #9333EA; }
  .badge-field { background: #EFF6FF; color: #2563EB; }
  .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: #3B82F6; color: #fff; }
  .btn-dark { background: #0F172A; color: #fff; }
  .btn-outline { background: #fff; color: #374151; border: 1px solid #E2E8F0; }
  .btn-green { background: #16A34A; color: #fff; }
  .btn-sm { padding: 4px 9px; font-size: 11px; }
  .detail-grid { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
  .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F1F5F9; font-size: 12px; }
  .info-label { color: #6B7280; flex-shrink: 0; }
  .info-value { font-weight: 500; text-align: right; max-width: 160px; word-break: break-all; }
  .proj-card { border: 1px solid #E8ECF0; border-radius: 8px; padding: 11px 13px; margin-bottom: 8px; }
  .proj-name { font-weight: 600; font-size: 13px; margin-bottom: 5px; line-height: 1.4; }
  .proj-meta { font-size: 11px; color: #6B7280; display: flex; gap: 10px; flex-wrap: wrap; }
  .match-pos-header { background: #0F172A; padding: 12px 16px; border-radius: 10px 10px 0 0; }
  .match-pos-title { color: #F1F5F9; font-weight: 700; font-size: 14px; }
  .match-pos-sub { color: #94A3B8; font-size: 11px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .match-candidate { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #F1F5F9; margin-bottom: 6px; }
  .rank-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .score-bar-bg { height: 5px; background: #F1F5F9; border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .score-bar-fill { height: 100%; border-radius: 3px; }
  .check-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .check-tag { font-size: 9px; padding: 1px 6px; border-radius: 8px; font-weight: 600; }
  .check-pass { background: #DCFCE7; color: #166534; }
  .check-fail { background: #FEE2E2; color: #991B1B; }
  .pos-form { border: 1px solid #E8ECF0; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-label { font-size: 10px; color: #6B7280; margin-bottom: 3px; }
  .form-input { width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid #E2E8F0; font-size: 12px; outline: none; background: #fff; }
  .form-select { width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid #E2E8F0; font-size: 12px; background: #fff; }
  .check-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; align-items: center; }
  .check-row label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 22px; width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  /* 로딩 화면 */
  #loading-screen { position: fixed; inset: 0; background: #0F172A; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
  #loading-screen.hidden { display: none; }
  .loading-logo { font-size: 48px; margin-bottom: 16px; }
  .loading-title { color: #F1F5F9; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .loading-sub { color: #64748B; font-size: 13px; margin-bottom: 32px; }
  .loading-bar-bg { width: 240px; height: 4px; background: #1E293B; border-radius: 2px; overflow: hidden; }
  .loading-bar-fill { height: 100%; background: #3B82F6; border-radius: 2px; animation: loadbar 1.5s ease-in-out infinite; }
  @keyframes loadbar { 0% { width: 0%; } 70% { width: 85%; } 100% { width: 100%; } }
  .error-box { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; padding: 20px; text-align: center; max-width: 400px; }
  .error-title { color: #DC2626; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .error-sub { color: #7F1D1D; font-size: 12px; line-height: 1.6; }
  @media (max-width: 700px) {
    .stat-grid { grid-template-columns: repeat(2,1fr); }
    .detail-grid { grid-template-columns: 1fr; }
    .form-grid2 { grid-template-columns: 1fr; }
    .nav-btn { padding: 5px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- 로딩 화면 -->
<div id="loading-screen">
  <div class="loading-logo">👷</div>
  <div class="loading-title">해외 감리 인력 관리</div>
  <div class="loading-sub" id="loading-msg">인력 데이터를 불러오는 중...</div>
  <div class="loading-bar-bg"><div class="loading-bar-fill"></div></div>
</div>

<!-- 헤더 -->
<div class="header">
  <div>
    <div class="header-title">👷 해외 감리 인력 관리</div>
    <div class="header-sub">Yooshin Engineering Corporation</div>
  </div>
  <div class="header-right">
    <span id="last-sync" style="color:#475569;font-size:11px"></span>
    <button class="sync-btn" onclick="loadExcelFromGithub(true)" id="sync-btn">
      🔄 데이터 새로고침
    </button>
    <nav class="nav">
      <button class="nav-btn active" onclick="showTab('tab-list')">인력 목록</button>
      <button class="nav-btn" onclick="showTab('tab-detail')" id="nav-detail" style="display:none">상세 보기</button>
      <button class="nav-btn" onclick="showTab('tab-bid')">입찰 매칭</button>
    </nav>
  </div>
</div>

<!-- ══ 인력 목록 ══ -->
<div class="tab active" id="tab-list">
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">전체 인원</div><div class="stat-value" style="color:#3B82F6" id="stat-total">0</div></div>
    <div class="stat-card"><div class="stat-label">투입중</div><div class="stat-value" style="color:#F59E0B" id="stat-active">0</div></div>
    <div class="stat-card"><div class="stat-label">대기중</div><div class="stat-value" style="color:#10B981" id="stat-wait">0</div></div>
    <div class="stat-card"><div class="stat-label">타사 파견</div><div class="stat-value" style="color:#8B5CF6" id="stat-dispatch">0</div></div>
  </div>
  <div class="filter-row">
    <input type="text" id="search-input" placeholder="이름·전공·자격증 검색..." oninput="renderList()">
    <button class="filter-btn active" onclick="setFilter('전체')">전체</button>
    <button class="filter-btn" onclick="setFilter('투입중')">투입중</button>
    <button class="filter-btn" onclick="setFilter('대기중')">대기중</button>
    <button class="filter-btn" onclick="setFilter('타사파견')">타사 파견</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr><th>이름</th><th>학위/전공</th><th>자격증</th><th>총경력</th><th>주분야</th><th>CS경력</th><th>해외경력</th><th>현황</th><th>CV갱신</th><th></th></tr>
      </thead>
      <tbody id="staff-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ══ 상세 보기 ══ -->
<div class="tab" id="tab-detail">
  <button class="btn btn-outline" style="margin-bottom:12px" onclick="showTab('tab-list')">← 목록으로</button>
  <div class="detail-grid">
    <div>
      <div class="card" id="detail-info"></div>
      <div style="margin-top:10px">
        <button class="btn btn-primary" style="width:100%" onclick="openEditModal()">✏️ 현황 / 메모 수정</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px" id="detail-proj-count">프로젝트 이력</div>
      <div id="detail-projects"></div>
    </div>
  </div>
</div>

<!-- ══ 입찰 매칭 ══ -->
<div class="tab" id="tab-bid">
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn btn-dark" id="bid-tab-input-btn" onclick="setBidTab('input')">📝 조건 입력</button>
    <button class="btn btn-outline" id="bid-tab-result-btn" onclick="setBidTab('result')">📊 매칭 결과</button>
  </div>
  <div id="bid-input-panel">
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">포지션별 요건 입력</div>
      <div style="font-size:12px;color:#6B7280;margin-bottom:14px">총경력·CS경력·분야 기준으로 1차 매칭합니다. 교량 특수경험 등 세부사항은 CV에서 직접 확인하세요.</div>
      <div id="positions-container"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-outline" style="flex:1" onclick="addPosition()">+ 포지션 추가</button>
        <button class="btn btn-dark" style="flex:2" onclick="runMatching()">🎯 매칭 실행</button>
      </div>
    </div>
  </div>
  <div id="bid-result-panel" style="display:none">
    <div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:16px;font-weight:700" id="result-title">매칭 결과</div>
        <div style="font-size:12px;color:#6B7280;margin-top:2px" id="result-sub"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="setBidTab('input')">← 조건 수정</button>
    </div>
    <div id="match-results"></div>
  </div>
</div>

<!-- ══ 편집 모달 ══ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">인력 정보 수정</div>
    <div style="font-size:12px;color:#6B7280;margin-bottom:14px">현황·CS경력·메모는 여기서 수정 저장됩니다.<br>엑셀 데이터를 새로고침해도 이 항목은 유지됩니다.</div>
    <div id="modal-content"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-green" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// ★ 여기만 본인 저장소 정보로 수정하세요 ★
const GITHUB_USER = 'cmjaehyon-boop';
const GITHUB_REPO = 'HR-management';
const EXCEL_PATH  = '유신 해외 감리 관리인력.xlsm';  // 루트에 올린 파일명
// ══════════════════════════════════════════════════════════════════

const EXCEL_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${EXCEL_PATH}`;
const LS_OVERRIDE = 'yooshin_hr_overrides'; // 수동 수정사항 저장 키
const LS_CACHE    = 'yooshin_hr_cache';     // 엑셀 파싱 캐시
const LS_SYNC     = 'yooshin_hr_sync';      // 마지막 동기화 시각

let staffData = [];
let selectedId = null;
let currentFilter = '전체';
let positions = [{ id:1, title:'', minTotalExp:0, minCsExp:0, overseasRequired:false, field:'', minDegree:'학사' }];
let posIdCounter = 2;

const FIELDS = ['Bridge','Road','Airport','Tunnel'];
const DEGREES = ['학사','석사','박사'];
const DEPLOY_OPTIONS = ['투입중','대기중','타사파견'];

// ── 오버라이드 (수동 수정사항) ──────────────────────────────────
function getOverrides() { return JSON.parse(localStorage.getItem(LS_OVERRIDE) || '{}'); }
function saveOverride(name, data) {
  const ov = getOverrides();
  ov[name] = { ...ov[name], ...data };
  localStorage.setItem(LS_OVERRIDE, JSON.stringify(ov));
}

// ── GitHub에서 엑셀 fetch ──────────────────────────────────────
async function loadExcelFromGithub(forceRefresh = false) {
  const syncBtn = document.getElementById('sync-btn');
  syncBtn.classList.add('loading');
  syncBtn.textContent = '⏳ 불러오는 중...';

  try {
    // 캐시 확인 (강제 새로고침 아니면 캐시 사용)
    if (!forceRefresh) {
      const cached = localStorage.getItem(LS_CACHE);
      if (cached) {
        staffData = applyOverrides(JSON.parse(cached));
        renderAll();
        hideLoading();
        updateSyncLabel();
        return;
      }
    }

    const res = await fetch(EXCEL_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`파일을 찾을 수 없습니다 (${res.status})\n경로: ${EXCEL_URL}`);

    const buf = await res.arrayBuffer();
    const parsed = parseExcel(buf);
    localStorage.setItem(LS_CACHE, JSON.stringify(parsed));
    localStorage.setItem(LS_SYNC, new Date().toISOString());

    staffData = applyOverrides(parsed);
    renderAll();
    hideLoading();
    updateSyncLabel();

  } catch(e) {
    showError(e.message);
  } finally {
    syncBtn.classList.remove('loading');
    syncBtn.textContent = '🔄 데이터 새로고침';
  }
}

function applyOverrides(parsed) {
  const ov = getOverrides();
  return parsed.map(s => {
    const o = ov[s.name] || {};
    return { ...s, ...o };
  });
}

function updateSyncLabel() {
  const t = localStorage.getItem(LS_SYNC);
  if (t) document.getElementById('last-sync').textContent = '업데이트: ' + new Date(t).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

// ── 엑셀 파싱 ─────────────────────────────────────────────────
function parseExcel(buf) {
  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });

  let headerRow = -1;
  for (let i=0; i<Math.min(rows.length,5); i++) {
    if (rows[i] && rows[i].includes('이름')) { headerRow=i; break; }
  }
  if (headerRow<0) throw new Error('헤더 행(이름 컬럼)을 찾을 수 없습니다.\n엑셀 파일 형식을 확인해주세요.');

  const headers = rows[headerRow];
  const col = (name) => headers.findIndex(h => h && String(h).includes(name));

  const C = {
    name:col('이름'), dob:col('DOB'), degree:col('학위'), major:col('전공'),
    status:col('재직상태'), joinYear:col('입사년도'),
    cvYn:col('CV 유무'), cvYear:col('최신화년도'), cvLocation:col('사용처'),
    country:col('국가'), projectName:col('과업명'), fund:col('재원'),
    field:col('사업분야'), workType:col('과업유형'), role:col('보직'),
    start:col('착수'), end:col('종료'), months:col('기간'),
    certs:col('자격사항'), training:col('training'), membership:col('Membership'),
    deploy:col('교체'), field1:col('분야1'), field2:col('분야2'),
    totalExp:col('총경력'), tlYears:col('Team Leader(년)'), tlCount:col('Team Leader(수)'),
    airportYears:col('Airport Project(년)'), roadYears:col('Road Project(년)'),
    overseasYears:col('해외 경력'), overseasCount:col('해외 프로젝트'),
    domesticYears:col('국내 경력'), seaYears:col('동남아 경력'), devYears:col('개발도상국 경력'),
    bridgeCs:col('교량 CS 경력'), roadCs:col('도로 CS 경력'), airportCs:col('공항 CS 경력'), tunnelCs:col('터널 CS 경력'),
    pavementCs:col('포장 감리'), structureCs:col('구조물 시공감리'), designYears:col('설계 경력'), tlExpYears:col('TL 경력'),
    cableStayedCnt:col('Cable-stayed 감리'), extradosedCnt:col('Extradosed 감리'),
    span50Cnt:col('경간50m'), maxSpan:col('최대 경간장'),
    materialsExp:col('Materials Eng'),
    road200m:col('도로 USD200M'), road300m:col('도로 USD300M'),
    bridge200m:col('교량 USD200M'), airport200m:col('공항 USD200M'),
    maxCost:col('최대 공사비'),
  };

  const staff={}, order=[];

  for (let i=headerRow+1; i<rows.length; i++) {
    const row=rows[i];
    if (!row) continue;
    const name=row[C.name];
    if (!name || typeof name!=='string') continue;

    if (!staff[name]) {
      order.push(name);
      const dob=row[C.dob], joinDate=row[C.joinYear], cvDate=row[C.cvYear];
      const f1=String(row[C.field1]||'').trim(), f2=String(row[C.field2]||'').trim();
      let mainField=f1;
      if (FIELDS.includes(f1)) mainField=f1;
      else if (FIELDS.includes(f2)) mainField=f2;

      const pf = (k) => parseFloat(row[C[k]])||0;
      const pi2 = (k) => parseInt(row[C[k]])||0;
      staff[name]={
        id: order.length, name,
        dob: dob instanceof Date ? dob.toISOString().slice(0,10) : String(dob||''),
        degree: String(row[C.degree]||'학사'),
        major: String(row[C.major]||''),
        certs: String(row[C.certs]||''),
        trainings: parseInt(row[C.training])||0,
        memberships: parseInt(row[C.membership])||0,
        totalExp: pf('totalExp'),
        tlYears: pf('tlYears'), tlCount: pi2('tlCount'),
        airportYears: pf('airportYears'), roadYears: pf('roadYears'),
        overseasYears: pf('overseasYears'), overseasCount: pi2('overseasCount'),
        cvUpdated: cvDate instanceof Date ? cvDate.getFullYear().toString() : (cvDate?String(cvDate).slice(0,4):''),
        cvLocation: String(row[C.cvLocation]||''),
        joinYear: joinDate instanceof Date ? joinDate.getFullYear() : (parseInt(joinDate)||0),
        mainField, field1:f1, field2:f2,
        deployment: String(row[C.deploy]||'').trim()||'대기중',
        // 신규 항목
        domesticYears: pf('domesticYears'), seaYears: pf('seaYears'), devYears: pf('devYears'),
        bridgeCs: pf('bridgeCs'), roadCs: pf('roadCs'), airportCs: pf('airportCs'), tunnelCs: pf('tunnelCs'),
        pavementCs: pf('pavementCs'), structureCs: pf('structureCs'),
        designYears: pf('designYears'), tlExpYears: pf('tlExpYears'),
        cableStayedCnt: pi2('cableStayedCnt'), extradosedCnt: pi2('extradosedCnt'),
        span50Cnt: pi2('span50Cnt'), maxSpan: pi2('maxSpan'),
        materialsExp: pf('materialsExp'),
        road200m: pi2('road200m'), road300m: pi2('road300m'),
        bridge200m: pi2('bridge200m'), airport200m: pi2('airport200m'),
        maxCost: pi2('maxCost'),
        csYears:0, memo:'', projects:[]
      };
    }

    const projName=row[C.projectName];
    if (projName) {
      const st=row[C.start], en=row[C.end];
      staff[name].projects.push({
        country: String(row[C.country]||''),
        name: String(projName),
        fund: String(row[C.fund]||''),
        field: String(row[C.field]||''),
        type: String(row[C.workType]||''),
        role: String(row[C.role]||''),
        start: st instanceof Date ? st.toISOString().slice(0,7) : String(st||'').slice(0,7),
        end:   en instanceof Date ? en.toISOString().slice(0,7) : String(en||'').slice(0,7),
        months: parseInt(row[C.months])||0,
      });
    }
  }

  // CS 경력 집계
  order.forEach(name=>{
    const s=staff[name];
    let csM=0;
    s.projects.forEach(p=>{ if(p.type&&p.type.toUpperCase().includes('CS')) csM+=p.months; });
    s.csYears=Math.round(csM/12*10)/10;
  });

  return order.map(n=>staff[n]);
}

// ── 매칭 ──────────────────────────────────────────────────────
function matchScore(person, req) {
  const checks=[];
  let score=0, max=0;
  function chk(label,pass,value){ checks.push({label,pass,value}); max++; if(pass) score++; }

  // 기본 경력
  if (req.minTotalExp>0)    chk(`총경력 ${req.minTotalExp}년↑`, person.totalExp>=req.minTotalExp, `${person.totalExp}년`);
  if (req.minCsExp>0)       chk(`CS ${req.minCsExp}년↑`, person.csYears>=req.minCsExp, `${person.csYears}년`);
  if (req.minTlExp>0)       chk(`TL ${req.minTlExp}년↑`, person.tlExpYears>=req.minTlExp, `${person.tlExpYears}년`);
  // 지역
  if (req.minSeaExp>0)      chk(`동남아 ${req.minSeaExp}년↑`, person.seaYears>=req.minSeaExp, `${person.seaYears}년`);
  if (req.minDevExp>0)      chk(`개발도상국 ${req.minDevExp}년↑`, person.devYears>=req.minDevExp, `${person.devYears}년`);
  if (req.overseasRequired) chk('해외 경험', person.overseasYears>0, `${person.overseasYears}년`);
  // 분야
  if (req.field) {
    const f=[person.field1,person.field2,person.mainField].map(x=>(x||'').toLowerCase());
    chk(`${req.field} 분야`, f.includes(req.field.toLowerCase()), person.mainField||person.field1);
  }
  if (req.minBridgeCs>0)    chk(`교량CS ${req.minBridgeCs}년↑`, person.bridgeCs>=req.minBridgeCs, `${person.bridgeCs}년`);
  if (req.minRoadCs>0)      chk(`도로CS ${req.minRoadCs}년↑`, person.roadCs>=req.minRoadCs, `${person.roadCs}년`);
  if (req.minPavementCs>0)  chk(`포장감리 ${req.minPavementCs}년↑`, person.pavementCs>=req.minPavementCs, `${person.pavementCs}년`);
  if (req.minStructureCs>0) chk(`구조물감리 ${req.minStructureCs}년↑`, person.structureCs>=req.minStructureCs, `${person.structureCs}년`);
  if (req.minMaterialsExp>0)chk(`Materials ${req.minMaterialsExp}년↑`, person.materialsExp>=req.minMaterialsExp, `${person.materialsExp}년`);
  // 특수교량
  if (req.minCableStayed>0) chk(`Cable-stayed ${req.minCableStayed}건↑`, person.cableStayedCnt>=req.minCableStayed, `${person.cableStayedCnt}건`);
  if (req.minSpan50>0)      chk(`경간50m↑ ${req.minSpan50}건↑`, person.span50Cnt>=req.minSpan50, `${person.span50Cnt}건`);
  // 규모
  if (req.minRoad200m>0)    chk(`도로USD200M↑ ${req.minRoad200m}건↑`, person.road200m>=req.minRoad200m, `${person.road200m}건`);
  if (req.minBridge200m>0)  chk(`교량USD200M↑ ${req.minBridge200m}건↑`, person.bridge200m>=req.minBridge200m, `${person.bridge200m}건`);
  if (req.minAirport200m>0) chk(`공항USD200M↑ ${req.minAirport200m}건↑`, person.airport200m>=req.minAirport200m, `${person.airport200m}건`);
  // 학위
  if (req.minDegree) {
    const rank={'학사':1,'석사':2,'박사':3};
    chk(`${req.minDegree}↑`, (rank[person.degree]||0)>=(rank[req.minDegree]||0), person.degree);
  }

  return { score: max>0?Math.round(score/max*100):100, checks };
}

function runMatching() {
  const valid=positions.filter(p=>p.title.trim());
  if (!valid.length) { alert('포지션명을 입력해주세요'); return; }
  if (!staffData.length) { alert('데이터가 없습니다. 엑셀을 먼저 GitHub에 업로드하고 새로고침하세요'); return; }

  const results=valid.map(pos=>{
    const candidates=staffData.map(s=>{
      const m=matchScore(s,pos);
      return {...s, matchScore:m.score, checks:m.checks};
    }).sort((a,b)=>b.matchScore-a.matchScore);
    return {pos,candidates};
  });
  renderMatchResults(results);
  setBidTab('result');
}

      <div style="padding:12px 14px">
        ${candidates.slice(0,5).map((c,ci)=>`
          <div class="match-candidate" style="background:${c.matchScore>=80?'#F0FDF4':ci===0?'#FFFBEB':'#fff'}">
            <div class="rank-circle" style="background:${rc[ci]||'#E5E7EB'}">${ci+1}</div>
            <div style="min-width:80px"><div style="font-weight:700;font-size:13px">${c.name}</div>${getBadgeHtml(c.deployment)}</div>
            <div style="min-width:48px;text-align:center">
              <div style="font-size:20px;font-weight:800;color:${sc(c.matchScore)}">${c.matchScore}</div>
              <div style="font-size:9px;color:#9CA3AF">점</div>
            </div>
            <div style="flex:1">
              <div class="score-bar-bg"><div class="score-bar-fill" style="width:${c.matchScore}%;background:${sc(c.matchScore)}"></div></div>
              <div class="check-tags">${c.checks.map(ch=>`<span class="check-tag ${ch.pass?'check-pass':'check-fail'}">${ch.pass?'✓':'✗'} ${ch.label}</span>`).join('')}</div>
            </div>
            <div style="min-width:90px;font-size:11px;color:#6B7280;text-align:right">
              <div>경력 ${c.totalExp}년</div><div>CS ${c.csYears}년</div><div>해외 ${c.overseasYears}년</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── 탭/필터 ───────────────────────────────────────────────────
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const map={'tab-list':0,'tab-detail':1,'tab-bid':2};
  document.querySelectorAll('.nav-btn')[map[id]]?.classList.add('active');
}
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===f));
  renderList();
}
function setBidTab(t){
  document.getElementById('bid-input-panel').style.display=t==='input'?'block':'none';
  document.getElementById('bid-result-panel').style.display=t==='result'?'block':'none';
  document.getElementById('bid-tab-input-btn').className='btn '+(t==='input'?'btn-dark':'btn-outline');
  document.getElementById('bid-tab-result-btn').className='btn '+(t==='result'?'btn-dark':'btn-outline');
}

// ── 로딩/에러 화면 ────────────────────────────────────────────
function hideLoading(){ document.getElementById('loading-screen').classList.add('hidden'); }
function showError(msg){
  document.getElementById('loading-screen').innerHTML=`
    <div class="error-box">
      <div class="error-title">⚠️ 데이터 로드 실패</div>
      <div class="error-sub">${msg}<br><br>
        GitHub 저장소에 엑셀 파일이 있는지,<br>
        코드 상단의 GITHUB_USER / GITHUB_REPO / EXCEL_PATH가<br>
        올바르게 설정되어 있는지 확인해주세요.
      </div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="loadExcelFromGithub(true)">다시 시도</button>
    </div>`;
}

// ── 시작 ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  renderPositions();
  loadExcelFromGithub(false);
});
</script>
</body>
</html>
